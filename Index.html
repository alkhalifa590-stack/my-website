
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>موقع خليفة</title>

<style>

body {
    background-color: #101827;
    font-family: Arial;
    color: white;
    text-align: center;
    padding: 30px 15px;
}

.card {
    background-color: #1e293b;
    padding: 30px 20px;
    border-radius: 20px;
    max-width: 400px;
    margin: auto;
}

h1 {
    color: #38bdf8;
    font-size: 30px;
}

h2 {
    color: #38bdf8;
}

p {
    color: #cbd5e1;
    font-size: 18px;
    line-height: 1.8;
}

ul {
    list-style: none;
    padding: 0;
}

li {
    background: #334155;
    margin: 10px;
    padding: 12px;
    border-radius: 10px;
}

button {
    background: #0ea5e9;
    color: white;
    border: none;
    padding: 14px 25px;
    border-radius: 10px;
    font-size: 17px;
}

</style>
</head>

<body>

<div class="card">

<h1>مرحباً، أنا خليفة</h1>

<p>طالب تقنية المعلومات</p>

<h2>نبذة عني</h2>

<p>
أتعلم تصميم وبرمجة المواقع،
وأسعى لتطوير مهاراتي في عالم التقنية.
</p>

<h2>مهاراتي</h2>

<ul>
<li>HTML</li>
<li>CSS</li>
<li>JavaScript</li>
</ul>

<button onclick="alert('أهلاً بك في موقعي!')">
تواصل معي
</button>

</div>

</body>
</html>
